name: NuGet Deployment

concurrency:
  group: nuget
  cancel-in-progress: true

on:
  push:
    branches:
      - master # Default release branch

# Required for NuGet Trusted Publishing (OIDC) and for the action to push git tags
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v5

      # - name: Setup dotnet
      #   uses: actions/setup-dotnet@v1
      #   with:
      #     dotnet-version: 3.1.200

      # Exchange the GitHub Actions OIDC token for a short-lived NuGet API key.
      # No stored secret to expire — the Trusted Publishing policy on NuGet.org
      # authorizes this repo/workflow/environment to mint a temporary key.
      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: gehnster

      # Publish
      - name: publish on version change
        id: publish_nuget
        uses: gehnster/publish-nuget@v2.6.12
        with:
          # Filepath of the project to be packaged, relative to root of repository
          PROJECT_FILE_PATH: EVEStandard/EVEStandard.csproj
          
          # NuGet package id, used for version detection & defaults to project name
          PACKAGE_NAME: PointyHatGames.EVEStandard
          
          # Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
          # VERSION_FILE_PATH: Directory.Build.props

          # Regex pattern to extract version info in a capturing group
          # VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$
          
          # Useful with external providers like Nerdbank.GitVersioning, ignores VERSION_FILE_PATH & VERSION_REGEX
          # VERSION_STATIC: 1.0.0

          # Flag to toggle git tagging, enabled by default
          # TAG_COMMIT: true

          # Format of the git tag, [*] gets replaced with actual version
          # TAG_FORMAT: v*

          # Short-lived API key minted by the NuGet/login step above (Trusted Publishing)
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

          # NuGet server uri hosting the packages, defaults to https://api.nuget.org
          # NUGET_SOURCE: https://api.nuget.org
          
          # Filepath of the nuspec to be used, relative to root of repository
          # NUSPEC_FILE: Sdk/Sdk.nuspec

          # Flag to toggle pushing symbols along with nuget package to the server, disabled by default
          INCLUDE_SYMBOLS: true
